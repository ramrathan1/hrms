    <title>Worksuite</title>

  <body>
    <!-- Shown until React mounts, so the first paint isn't a blank white page. -->
    <div id="root">
      <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#f6f6fb">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#7C5CFF,#4CC3FF);display:flex;align-items:center;justify-content:center;color:#fff;font:900 26px/1 Arial Black,Arial">W</div>
          <div style="width:120px;height:3px;border-radius:3px;background:#e6e6f0;overflow:hidden">
            <div style="width:40%;height:100%;background:#7C5CFF;animation:wsboot 1s ease-in-out infinite"></div>
          </div>
        </div>
      </div>
    </div>
    <style>@keyframes wsboot{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
